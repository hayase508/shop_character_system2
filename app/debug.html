<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b1712">
<title>接客システム・開発テスト</title>
<style>
:root{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;color:#f8ecd3;background:#21120f}
*{box-sizing:border-box}
body{position:relative;max-width:920px;min-height:100vh;margin:0 auto;padding:48px 32px;background:radial-gradient(circle at 50% 12%,#573025 0,transparent 38%),linear-gradient(135deg,#311b15,#180e0c);line-height:1.8}
body::before{position:fixed;inset:18px;border:1px solid rgba(216,173,85,.5);box-shadow:inset 0 0 0 4px rgba(70,31,21,.7);content:"";pointer-events:none}
h1{margin:0 0 22px;padding:18px 24px;border-block:1px solid rgba(216,173,85,.45);color:#f4d991;font-size:clamp(27px,4vw,42px);font-weight:500;letter-spacing:.12em;text-align:center}
p{font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif}
a,button{display:inline-block;margin:7px 5px;padding:11px 18px;border:1px solid rgba(216,173,85,.62);border-radius:3px;background:linear-gradient(#9a382e,#6e211c);box-shadow:0 6px 16px rgba(0,0,0,.24);color:#fff4dc;font:600 15px/1.4 "Yu Gothic",sans-serif;text-decoration:none;cursor:pointer}
a:hover,button:hover{filter:brightness(1.14)}
input{width:110px;margin-left:8px;padding:8px 10px;border:1px solid #a57c3c;border-radius:3px;background:#f5e8ce;color:#2a1a15;font-size:16px}
pre{min-height:150px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:24px;padding:22px;border:6px solid #63271f;outline:1px solid rgba(216,173,85,.68);outline-offset:-11px;background:linear-gradient(150deg,#f8edda,#e3cfa9);box-shadow:0 18px 44px rgba(0,0,0,.35);color:#2a1a15;font:14px/1.65 ui-monospace,monospace}
@media(max-width:600px){body{padding:34px 24px}body::before{inset:8px}h1{font-size:25px}a,button{margin:5px 2px;padding:10px 12px;font-size:13px}}
</style>
<h1>接客システム・開発テスト</h1>
<p>接客画面を別タブで開き、「接客を開始」を押してください。模擬イベントは本番DBに保存されません。</p>
<a href="/" target="_blank" rel="noopener">接客画面を開く</a>
<p>前回来店からの日数 <input id="days" type="number" min="0" max="36500" value="10"></p>
<button data-url="/api/debug/new-customer">初来店</button>
<button id="returning">再来店（日数を指定）</button>
<button data-url="/api/debug/returning-customer?days_since_last_visit=60">60日以内（境界）</button>
<button data-url="/api/debug/returning-customer?days_since_last_visit=61">60日を超過</button>
<button data-url="/api/debug/finish-greeting">接客を中断</button>
<button id="health">状態を確認</button>
<pre id="result" aria-live="polite">テスト結果が表示されます。</pre>
<script src="/static/debug.js" defer></script>
</html>
