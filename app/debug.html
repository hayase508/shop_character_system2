<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>接客システム・開発テスト</title>
<style>
body{font:17px/1.8 system-ui,sans-serif;background:#181512;color:#f3e7d5;max-width:850px;margin:50px auto;padding:20px}
button,a{padding:12px 18px;margin:8px;border-radius:10px;color:#241a10;background:#e2bc77;border:0;font-size:16px;cursor:pointer}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#28231d;padding:20px;border-radius:10px}
</style>
<h1>接客システム・開発テスト</h1>
<p>接客画面を別タブで開き、「接客を開始」を押してください。模擬イベントは本番DBに保存されません。</p>
<a href="/" target="_blank" rel="noopener">接客画面を開く</a>
<p>前回来店からの日数 <input id="days" type="number" min="0" max="36500" value="10"></p>
<button data-url="/api/debug/new-customer">初来店</button>
<button id="returning">再来店（日数を指定）</button>
<button data-url="/api/debug/returning-customer?days_since_last_visit=60">60日以内（境界）</button>
<button data-url="/api/debug/returning-customer?days_since_last_visit=61">60日を超過</button>
<button data-url="/api/debug/finish-greeting">接客を中断</button>
<button id="health">状態を確認</button>
<pre id="result" aria-live="polite">テスト結果が表示されます。</pre>
<script src="/static/debug.js" defer></script>
</html>
